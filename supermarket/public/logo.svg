<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SuperMarket Express">
  <!-- SuperMarket Express logo (minimal): a green grocery bag with a white leaf.
       Two shapes and one colour: the brand green #00873E (same as color-brand in index.css). -->

  <!-- Bag handle -->
  <path d="M25 18v-3.5a7 7 0 0 1 14 0V18" fill="none" stroke="#00873E" stroke-width="4" stroke-linecap="round"/>

  <!-- Bag -->
  <path d="M15.5 18h33a3.5 3.5 0 0 1 3.5 3.8l-2.1 31a5.5 5.5 0 0 1-5.5 5.2H19.6a5.5 5.5 0 0 1-5.5-5.2L12 21.8A3.5 3.5 0 0 1 15.5 18z" fill="#00873E"/>

  <!-- Leaf = fresh groceries -->
  <path d="M23.5 50Q23.5 33.5 41 31.5Q41 48.5 23.5 50Z" fill="#FFFFFF"/>
</svg>
